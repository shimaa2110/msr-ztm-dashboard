  <style>
    :root {
      --navy: #0f172a;
      --navy-2: #152238;
      --navy-light: #1e2c47;
      --bg: #eef1f6;
      --card: #ffffff;
      --border: #e5e9f0;
      --text: #1a2233;
      --text-soft: #5b6478;
      --text-faint: #8993a8;
      --teal: #0ea5a3;
      --teal-light: #e0f7f6;
      --blue: #3b6fd6;
      --blue-light: #e8eefc;
      --green: #16a34a;
      --green-light: #e8f8ee;
      --red: #dc2626;
      --red-light: #fdecec;
      --amber: #d97706;
      --amber-light: #fef3e0;
      --purple: #7c5cff;
      --purple-light: #efeaff;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 6px 20px rgba(15, 23, 42, .06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== LAYOUT ===== */
    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #cbd5e1;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      z-index: 50;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 22px 20px 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 15px;
      flex-shrink: 0;
    }

    .brand-text {
      line-height: 1.25;
    }

    .brand-text b {
      color: #fff;
      font-size: 14.5px;
      display: block;
    }

    .brand-text span {
      font-size: 11px;
      color: #8ea0be;
    }

    .nav {
      padding: 14px 10px;
      flex: 1;
    }

    .nav-group-title {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #64748b;
      padding: 14px 12px 6px 12px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13.2px;
      color: #b7c2d6;
      margin-bottom: 2px;
      transition: .15s;
      font-weight: 500;
    }

    .nav-item .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #475569;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: #fff;
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(14, 165, 163, .22), rgba(14, 165, 163, .04));
      color: #fff;
      box-shadow: inset 3px 0 0 var(--teal);
    }

    .nav-item.active .dot {
      background: var(--teal);
    }

    .nav-item.sub {
      padding-left: 30px;
      font-size: 12.6px;
    }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      font-size: 11px;
      color: #64748b;
    }

    .main {
      margin-left: 250px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar h1 {
      font-size: 19px;
      margin: 0;
      font-weight: 700;
    }

    .topbar .sub {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 12px;
      width: 230px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      width: 100%;
      color: var(--text);
    }

    .search-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 340px;
      max-height: 360px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .14);
      z-index: 100;
      padding: 6px;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: .12s;
    }

    .search-result:hover {
      background: var(--bg);
    }

    .sr-type {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--teal);
      background: var(--teal-light);
      padding: 3px 7px;
      border-radius: 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .sr-body {
      flex: 1;
      min-width: 0;
    }

    .sr-label {
      font-size: 12.8px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sr-sub {
      font-size: 11px;
      color: var(--text-faint);
    }

    .sr-value {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      flex-shrink: 0;
    }

    .search-empty {
      padding: 14px;
      font-size: 12.5px;
      color: var(--text-faint);
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 9px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal), #0c8f8d);
      color: #fff;
      box-shadow: 0 4px 12px rgba(14, 165, 163, .3);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    .btn-ghost {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: #e2e6ee;
    }

    .content {
      padding: 24px 28px 60px 28px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
      animation: fadein .25s ease;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-header {
      margin-bottom: 18px;
    }

    .page-header h2 {
      font-size: 20px;
      margin: 0 0 4px 0;
      font-weight: 700;
    }

    .page-header p {
      margin: 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .filter-bar label {
      font-size: 11.5px;
      color: var(--text-faint);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-right: 4px;
    }

    .filter-bar select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .filter-chip-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 6px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-soft);
      transition: .15s;
    }

    .chip.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    /* ===== KPI CARDS ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .kpi-card.kpi-clickable {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .kpi-card.kpi-clickable:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, .08), 0 14px 32px rgba(15, 23, 42, .10);
      border-color: #d6dce6;
    }

    .kpi-card.kpi-clickable:active {
      transform: translateY(0px) scale(.98);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }

    .kpi-card.kpi-clickable:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .kpi-card.kpi-clickable::after {
      content: '';
      position: absolute;
      top: 12px;
      right: 12px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c7cedb;
      opacity: .0;
      transition: opacity .15s ease;
    }

    .kpi-card.kpi-clickable:hover::after {
      opacity: .9;
    }

    /* Row highlighted by a KPI card click (e.g. "Highest Month") */
    tr.row-selected {
      background: var(--blue-light) !important;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    tr.row-selected td {
      font-weight: 700;
      color: var(--text);
    }

    .kpi-card .icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .kpi-card .label {
      font-size: 11.5px;
      color: var(--text-faint);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .kpi-card .value {
      font-size: 23px;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text);
      letter-spacing: -.01em;
    }

    .kpi-card .delta {
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .delta.up {
      color: var(--red);
    }

    .delta.down {
      color: var(--green);
    }

    .delta.flat {
      color: var(--text-faint);
    }

    .icon.teal {
      background: var(--teal-light);
      color: var(--teal);
    }

    .icon.blue {
      background: var(--blue-light);
      color: var(--blue);
    }

    .icon.green {
      background: var(--green-light);
      color: var(--green);
    }

    .icon.amber {
      background: var(--amber-light);
      color: var(--amber);
    }

    .icon.purple {
      background: var(--purple-light);
      color: var(--purple);
    }

    .icon.red {
      background: var(--red-light);
      color: var(--red);
    }

    /* ===== GRID / CARDS ===== */
    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: 1fr 1fr;
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    @media(max-width:1200px) {
      .grid.cols-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid.cols-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-head h3 {
      font-size: 14.5px;
      margin: 0;
      font-weight: 700;
    }

    .card-head .tag {
      font-size: 10.5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .tag.msr {
      background: var(--blue-light);
      color: var(--blue);
    }

    .tag.ztm {
      background: var(--teal-light);
      color: var(--teal);
    }

    .chart-wrap {
      position: relative;
      height: 260px;
    }

    .chart-wrap.sm {
      height: 200px;
    }

    .chart-wrap.lg {
      height: 320px;
    }

    /* ===== TABLE ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.8px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-faint);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f7f9fc;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .badge {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge.hi {
      background: var(--red-light);
      color: var(--red);
    }

    .badge.lo {
      background: var(--green-light);
      color: var(--green);
    }

    .badge.mid {
      background: var(--amber-light);
      color: var(--amber);
    }

    .rank {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--navy);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
    }

    /* ===== CATEGORY NAV CARDS ===== */
    .cat-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .cat-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: .15s;
      box-shadow: var(--shadow);
    }

    .cat-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, .09);
    }

    .cat-tile .t-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .cat-tile .t-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
    }

    .cat-tile .t-val {
      font-size: 15px;
      font-weight: 800;
      margin-top: 4px;
    }

    /* ===== EMPTY / NA ===== */
    .na {
      color: var(--text-faint);
      font-style: italic;
    }

    .no-data-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      gap: 6px;
    }

    .no-data-icon {
      font-size: 26px;
      opacity: .6;
    }

    .no-data-text {
      font-size: 12.5px;
      font-weight: 600;
    }

    /* ===== SUMMARY TEXT ===== */
    .insight-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .insight-list li {
      display: flex;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .insight-list li:last-child {
      border-bottom: none;
    }

    .insight-list li .ico {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    /* ===== FOOTER NOTE ===== */
    .note {
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 10px;
      line-height: 1.5;
    }

    /* ===== PRINT ===== */
    @media print {

      .sidebar,
      .topbar,
      .filter-bar,
      .btn,
      .no-print {
        display: none !important;
      }

      .main {
        margin-left: 0 !important;
      }

      body {
        background: #fff;
      }

      .page {
        display: block !important;
        page-break-after: always;
      }

      .card {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
      }

      .kpi-card {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
      }

      .print-page {
        page-break-after: always;
        padding-top: 4mm;
      }

      .print-page:last-child {
        page-break-after: auto;
      }

      .print-page h2 {
        font-size: 19px;
        border-bottom: 2px solid #0ea5a3;
        padding-bottom: 8px;
        margin-bottom: 14px;
      }

      .print-page h3 {
        font-size: 14px;
        margin: 14px 0 8px 0;
      }

      table {
        font-size: 11px;
      }

      th,
      td {
        padding: 6px 8px;
      }

      @page {
        size: A4;
        margin: 14mm;
      }
    }

    .print-only {
      display: none;
    }

    @media print {
      .print-only {
        display: block;
      }
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c7cedb;
      border-radius: 4px;
    }

    /* ===== Live connection status ===== */
    .live-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 12.5px;
      white-space: nowrap;
    }

    .live-status-dot {
      font-size: 11px;
      line-height: 1;
    }

    .live-status-label {
      font-weight: 700;
    }

    .live-status-label.live-ok {
      color: var(--green);
    }

    .live-status-label.live-mid {
      color: var(--amber);
    }

    .live-status-label.live-bad {
      color: var(--red);
    }

    .live-status-ts {
      color: var(--text-faint);
      border-left: 1px solid var(--border);
      padding-left: 7px;
      margin-left: 1px;
    }

    .live-error-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--red-light);
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      padding: 10px 16px;
      margin: 0 28px 0 28px;
      font-size: 13px;
      font-weight: 600;
    }

    .live-error-icon {
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar no-print">

    const LIVE_FETCH_TIMEOUT_MS = 15 * 1000; // abort a hung request after 15s

    let liveFetchInFlight = false;
    let livePollTimer = null;

    function validateRawShape(data) {
      return !!(data && typeof data === 'object' &&

        data.ztm_months && typeof data.ztm_months === 'object' &&
        data.msr_ytd && data.ztm_ytd);
    }

    function setConnectionStatus(state, detail) {
      liveConnectionState = state;
      const dot = document.getElementById('liveStatusDot');
      const label = document.getElementById('liveStatusLabel');
      const ts = document.getElementById('liveStatusTs');
      if (dot && label) {
        if (state === 'live') {
          dot.textContent = '🟢';
          label.textContent = 'LIVE — Connected';
          label.className = 'live-status-label live-ok';
        } else if (state === 'connecting') {
          dot.textContent = '🟡';
          label.textContent = 'Connecting…';
          label.className = 'live-status-label live-mid';
        } else {
          dot.textContent = '🔴';
          label.textContent = 'OFFLINE — Connection Error';
          label.className = 'live-status-label live-bad';
        }
      }
      if (ts) {
        ts.textContent = 'Last updated: ' + (lastLiveSuccessAt ? lastLiveSuccessAt.toLocaleTimeString('en-GB') : 'never');
      }
      const errBox = document.getElementById('liveErrorBanner');
      if (errBox) {
        if (state === 'offline') {
          errBox.style.display = 'flex';
          const msg = errBox.querySelector('.live-error-msg');
          if (msg) {
            msg.textContent = 'LIVE CONNECTION ERROR — showing ' +
              (lastLiveSuccessAt ? 'the last data successfully synced at ' + lastLiveSuccessAt.toLocaleTimeString('en-GB') : 'the embedded placeholder data (never synced live)') +
              '. ' + (detail || '');
          }
        } else {
          errBox.style.display = 'none';
        }
      }
    }

    // raw payload. Called once on initial load and again after every successful
    // live fetch — see the block after buildSearchIndex()/combinedForMonth().
    async function fetchLiveData(opts) {
      opts = opts || {};
      if (liveFetchInFlight) return; // never allow overlapping requests
      liveFetchInFlight = true;
      const btn = document.getElementById('liveRefreshBtn');
      if (btn) btn.disabled = true;
      if (opts.isManual) setConnectionStatus('connecting');

      const timeoutId = setTimeout(() => controller.abort(), LIVE_FETCH_TIMEOUT_MS);

        console.error('Live Google Sheet sync failed:', err);
        setConnectionStatus('offline', detail);
      } finally {
        clearTimeout(timeoutId);
        liveFetchInFlight = false;
        if (btn) btn.disabled = false;
      }
    }

      },
      {
        key: 'accommodation', name: 'Accommodation', icon: '🏨', color: '#7c5cff',
        msr: (d) => d.accommodation.total, ztm: (d) => d.accommodation.total
      },
      {
        key: 'traveling', name: 'Traveling', icon: '✈️', color: '#dc2626',
        msr: (d) => d.traveling.month_cost, ztm: (d) => d.traveling.month_cost
      },
      {
        key: 'printing', name: 'Printing', icon: '🖨️', color: '#0891b2',
        msr: (d) => d.printing.total, ztm: null
      },
      {
        key: 'stationery', name: 'Stationery', icon: '📎', color: '#be185d',
        msr: (d) => d.stationery.total, ztm: (d) => d.stationery.total
      },
      {
        key: 'landscape', name: 'Landscape', icon: '🌳', color: '#65a30d',
        msr: (d) => d.landscape.total, ztm: (d) => d.landscape.total
      },
    ];
    function catByKey(k) { return CATS.find(c => c.key === k); }

    // ============ MONTHLY COMBINED TOTALS ============
    function monthMSRTotal(d) {
      return d.restaurant.month_cost + d.buffet_total + d.cleaning.month_cost + d.transportation.total +
        d.accommodation.total + d.traveling.month_cost + (d.printing ? d.printing.total : 0) +
        d.stationery.total + d.landscape.total + (d.vehicle_totals ? d.vehicle_totals.grand_total : 0);
    }
    function monthZTMTotal(d) {
      return d.restaurant.month_cost + d.buffet_total + d.cleaning.month_cost + d.transportation.total +
        d.accommodation.total + d.traveling.month_cost + d.stationery.total + d.landscape.total +
        (d.vehicle_totals ? d.vehicle_totals.grand_total : 0);
    }

    let MSR_MONTHLY_TOTALS = [], ZTM_MONTHLY_TOTALS = [];
    let TOTAL_MSR = 0, TOTAL_ZTM = 0, TOTAL_COMBINED = 0;
    let ALL_MONTHS = [];
    let highestMonth = null, lowestMonth = null, hiVal = -Infinity, loVal = Infinity;
    let avgMonthlyCost = 0;
    let SEARCH_INDEX = [];

    function combinedForMonth(m) {
      const msrV = MSR[m] ? monthMSRTotal(MSR[m]) : null;
      const ztmV = ZTM[m] ? monthZTMTotal(ZTM[m]) : null;
      return { msr: msrV, ztm: ztmV, combined: (msrV || 0) + (ztmV || 0) };
    }

    // Single source of truth for turning a raw Apps Script payload into every
    // derived figure the dashboard reads (month lists, totals, hi/lo month,
    // search index). No values are recalculated differently from what the
    // Sheet already reports — this only aggregates the figures it returns.
    function computeModel(rawData) {
      RAW = rawData;
      MSR = rawData.msr_months || {};
      ZTM = rawData.ztm_months || {};
      MSR_YTD = rawData.msr_ytd || {};
      ZTM_YTD = rawData.ztm_ytd || {};

      MSR_MONTHS = MASTER_MONTH_ORDER.filter(m => MSR[m]);
      ZTM_MONTHS = MASTER_MONTH_ORDER.filter(m => ZTM[m]);

      MSR_MONTHLY_TOTALS = MSR_MONTHS.map(m => monthMSRTotal(MSR[m]));
      ZTM_MONTHLY_TOTALS = ZTM_MONTHS.map(m => monthZTMTotal(ZTM[m]));
      TOTAL_MSR = MSR_MONTHLY_TOTALS.reduce((a, b) => a + b, 0);
      TOTAL_ZTM = ZTM_MONTHLY_TOTALS.reduce((a, b) => a + b, 0);
      TOTAL_COMBINED = TOTAL_MSR + TOTAL_ZTM;

      // Union of every month present in either program, in calendar order
      ALL_MONTHS = MASTER_MONTH_ORDER.filter(m => MSR[m] || ZTM[m]);

      highestMonth = null; lowestMonth = null; hiVal = -Infinity; loVal = Infinity;
      ALL_MONTHS.forEach(m => {
        const v = combinedForMonth(m).combined;
        if (v > hiVal) { hiVal = v; highestMonth = m; }
        if (v < loVal) { loVal = v; lowestMonth = m; }
      });
      avgMonthlyCost = ALL_MONTHS.length ? TOTAL_COMBINED / ALL_MONTHS.length : 0;

      if (typeof buildSearchIndex === 'function') SEARCH_INDEX = buildSearchIndex();
    }

    computeModel(RAW); // initial synchronous render uses the embedded placeholder; fetchLiveData() supersedes it below

    // ============ VEHICLES ============
    function allVehiclesFlat() {
      const rows = [];
      MSR_MONTHS.forEach(m => {
        (MSR[m].vehicles || []).forEach(v => {
          rows.push({
            source: 'MSR', month: m, vehicle: v.vehicle, driver: v.driver, gasoline: v.gasoline || 0,
            maintenance: v.maintenance || 0, total: v.total || 0
          });
        });
      });
      ZTM_MONTHS.forEach(m => {
        (ZTM[m].vehicles || []).forEach(v => {
          rows.push({
            source: 'ZTM', month: m, vehicle: v.vehicle, driver: v.driver, gasoline: v.gasoline || 0,
            maintenance: v.maintenance || 0, total: v.total || 0
          });
        });
      });
      return rows;
    }
    function vehicleAggregates() {
      const flat = allVehiclesFlat();
      const map = {};
      flat.forEach(r => {
        const key = r.vehicle;
        if (!map[key]) map[key] = { vehicle: r.vehicle, driver: r.driver, total: 0, gasoline: 0, maintenance: 0, months: 0, sources: new Set() };
        map[key].total += r.total;
        map[key].gasoline += r.gasoline;
        map[key].maintenance += r.maintenance;
        map[key].months += 1;
        map[key].sources.add(r.source);
        if (r.driver) map[key].driver = r.driver;
      });
      return Object.values(map).map(v => ({ ...v, sources: Array.from(v.sources) })).sort((a, b) => b.total - a.total);
    }

    // ============ NAVIGATION ============
    const NAV = [

      el.innerHTML = html;
    }

    const PAGE_TITLES = {
      dashboard: ['Executive Dashboard', 'Consolidated MSR & ZTM cost overview — Jan–Jul 2026'],
      executive: ['Executive Summary', 'Key figures and management insights, sourced directly from the workbook'],

    };
    CATS.forEach(c => {
      PAGE_TITLES['cat-' + c.key] = [c.name, `${c.name} cost detail — MSR & ZTM, monthly and YTD`];
    });

    let currentPage = 'dashboard';
    function navigate(id) {
      currentPage = id;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === id));
      const [title, sub] = PAGE_TITLES[id] || [id, ''];
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageSub').textContent = sub;
      document.getElementById('content').innerHTML = renderPage(id);
      requestAnimationFrame(() => mountCharts(id));
      window.scrollTo(0, 0);
    }

    /* ============ UNIFIED SEARCH INDEX ============ */
    function buildSearchIndex() {
      const idx = [];
      vehicleAggregates().forEach(v => {
        idx.push({ type: 'Vehicle', label: v.vehicle, sub: v.driver || 'No driver on record', value: EGP(v.total), page: 'vehicles', focus: v.vehicle });
        if (v.driver) {
          idx.push({ type: 'Driver', label: v.driver, sub: 'Drives ' + v.vehicle, value: EGP(v.total), page: 'vehicles', focus: v.driver });
        }
      });
      CATS.forEach(c => {
        const m = c.msr ? sumMonthly(MSR, MSR_MONTHS, c.msr) : 0;
        const z = c.ztm ? sumMonthly(ZTM, ZTM_MONTHS, c.ztm) : 0;
        idx.push({ type: 'Category', label: c.name, sub: 'YTD combined cost', value: EGP(m + z), page: 'cat-' + c.key });
      });
      ALL_MONTHS.forEach(m => {
        const c = combinedForMonth(m);
        idx.push({ type: 'Month', label: m + ' 2026', sub: 'Combined MSR + ZTM', value: EGP(c.combined), page: 'monthly' });
      });
      idx.push({ type: 'Program', label: 'MSR', sub: 'Total program cost', value: EGP(TOTAL_MSR), page: 'msr' });
      idx.push({ type: 'Program', label: 'ZTM', sub: 'Total program cost', value: EGP(TOTAL_ZTM), page: 'ztm' });
      return idx;
    }
    // SEARCH_INDEX is built inside computeModel() and rebuilt on every live refresh.

    function doGlobalSearch(q) {
      const box = document.getElementById('searchDropdown');
      const query = q.trim().toLowerCase();
      if (!query) { box.style.display = 'none'; box.innerHTML = ''; return; }
      const results = SEARCH_INDEX.filter(r =>
        r.label.toLowerCase().includes(query) || (r.sub && r.sub.toLowerCase().includes(query))
      ).slice(0, 8);
      if (!results.length) {
        box.innerHTML = `<div class="search-empty">No matches for "${q}"</div>`;
      } else {
        box.innerHTML = results.map(r => `
      <div class="search-result" onclick="goToSearchResult('${r.page}', '${(r.focus || '').replace(/'/g, "\\'")}')">
        <span class="sr-type">${r.type}</span>
        <div class="sr-body"><div class="sr-label">${r.label}</div><div class="sr-sub">${r.sub}</div></div>
        <div class="sr-value">${r.value}</div>
      </div>`).join('');
      }
      box.style.display = 'block';
    }
    function goToSearchResult(page, focus) {
      document.getElementById('searchDropdown').style.display = 'none';
      document.getElementById('globalSearch').value = '';
      navigate(page);
      if (page === 'vehicles' && focus) {
        setTimeout(() => {
          const input = document.getElementById('vehicleSearchInput');
          if (input) { input.value = focus; input.dispatchEvent(new Event('input')); }
        }, 80);
      }
    }
    document.addEventListener('click', (e) => {
      const box = document.getElementById('searchDropdown');
      const wrap = document.getElementById('searchBoxWrap');
      if (box && wrap && !wrap.contains(e.target)) box.style.display = 'none';
    });

    document.addEventListener('DOMContentLoaded', () => {
      buildNav();
      navigate('dashboard');
      setConnectionStatus('connecting');
      fetchLiveData({}).finally(startLivePolling); // first live attempt, then poll every 30s regardless of outcome
    });

  </script>
  <script>
    /* ================= PAGE RENDERERS ================= */
    let chartRegistry = {};
    function destroyCharts() {
      Object.values(chartRegistry).forEach(c => { try { c.destroy(); } catch (e) { } });
      chartRegistry = {};
    }

    // Replace any non-finite value (undefined/null/NaN/Infinity) with 0 before it reaches Chart.js.
    // This never touches the underlying source data — only the values handed to the renderer.
    function safeNumber(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }
    function sanitizeChartConfig(config) {
      if (config && config.data && Array.isArray(config.data.datasets)) {
        config.data.datasets.forEach(ds => {
          if (Array.isArray(ds.data)) {
            ds.data = ds.data.map(v => (v === null ? null : safeNumber(v))); // keep explicit null (gap in line charts), sanitize everything else
          }
        });
      }
      return config;
    }
    function chartHasData(config) {
      if (!config || !config.data || !Array.isArray(config.data.datasets)) return false;
      return config.data.datasets.some(ds => Array.isArray(ds.data) && ds.data.some(v => v !== null && v !== undefined && safeNumber(v) !== 0));
    }
    function showNoData(canvasId, message) {
      const el = document.getElementById(canvasId);
      if (!el) return;
      const wrap = el.parentElement;
      wrap.innerHTML = `<div class="no-data-state">
    <div class="no-data-icon">📭</div>
    <div class="no-data-text">${message || 'No Data Available'}</div>
  </div>`;
    }
    function mkChart(id, config) {
      const el = document.getElementById(id);
      if (!el) { console.error('Chart canvas not found: ' + id); return; }
      // guard against duplicate instances on the same canvas (filters re-render charts)
      if (chartRegistry[id]) { try { chartRegistry[id].destroy(); } catch (e) { } delete chartRegistry[id]; }
      if (typeof Chart !== 'undefined' && typeof Chart.getChart === 'function') {
        const existing = Chart.getChart(el);
        if (existing) { try { existing.destroy(); } catch (e) { } }
      }
      if (typeof Chart === 'undefined') {
        console.error('Chart.js failed to load — cannot render chart: ' + id);
        showNoData(id, 'Chart library failed to load');
        return;
      }
      sanitizeChartConfig(config);
      if (!chartHasData(config)) {
        showNoData(id, 'No Data Available');
        return;
      }
      config.options = config.options || {};
      if (config.options.responsive === undefined) config.options.responsive = true;
      if (config.options.maintainAspectRatio === undefined) config.options.maintainAspectRatio = false;
      chartRegistry[id] = new Chart(el.getContext('2d'), config);
    }

    const PALETTE = ['#3b6fd6', '#0ea5a3', '#d97706', '#7c5cff', '#dc2626', '#16a34a', '#0891b2', '#be185d', '#65a30d', '#64748b'];

    function renderPage(id) {
      destroyCharts();
      if (id === 'dashboard') return pageDashboard();
      if (id === 'executive') return pageExecutive();
      if (id === 'msr') return pageProgram('MSR');
      if (id === 'ztm') return pageProgram('ZTM');
      if (id === 'monthly') return pageMonthly();
      if (id === 'compare') return pageCompare();
      if (id === 'categories') return pageCategories();
      if (id.startsWith('cat-')) return pageCategoryDetail(id.replace('cat-', ''));
      if (id === 'vehicles') return pageVehicles();
      if (id === 'gasoline') return pageGasoline();
      if (id === 'maintenance') return pageMaintenance();
      if (id === 'saden') return pageSaden();
      if (id === 'dataquality') return pageDataQuality();
      if (id === 'print') return pagePrintReport();
      return '<div class="card">Page not found.</div>';
    }

    function mountCharts(id) {
      if (id === 'dashboard') mountDashboardCharts();
      else if (id === 'executive') mountExecutiveCharts();
      else if (id === 'msr') mountProgramCharts('MSR');
      else if (id === 'ztm') mountProgramCharts('ZTM');
      else if (id === 'monthly') mountMonthlyCharts();
      else if (id === 'compare') mountCompareCharts();
      else if (id === 'categories') mountCategoriesCharts();
      else if (id.startsWith('cat-')) mountCategoryDetailCharts(id.replace('cat-', ''));
      else if (id === 'vehicles') mountVehiclesPage();
      else if (id === 'gasoline') mountGasolineCharts();
      else if (id === 'maintenance') mountMaintenanceCharts();
      else if (id === 'print') mountPrintCharts();
    }

    /* ============================================================
       DASHBOARD (landing)
    ============================================================ */
    function pageDashboard() {
      return `
  <div class="kpi-grid">
    ${kpiCard('teal', '💰', 'Total Cost (YTD)', fmtM(TOTAL_COMBINED), `MSR ${fmtM(TOTAL_MSR)} · ZTM ${fmtM(TOTAL_ZTM)}`, { onClick: "navigate('monthly')", tooltip: 'Click to view the combined MSR + ZTM monthly breakdown' })}
    ${kpiCard('blue', '🅼', 'Total MSR', fmtM(TOTAL_MSR), `${MSR_MONTHS.length} months reported`, { onClick: "navigate('msr')", tooltip: 'Click to view MSR details' })}
    ${kpiCard('green', '🆉', 'Total ZTM', fmtM(TOTAL_ZTM), `${ZTM_MONTHS.length} months reported`, { onClick: "navigate('ztm')", tooltip: 'Click to view ZTM details' })}
    ${kpiCard('amber', '📅', 'Avg Monthly Cost', fmtM(avgMonthlyCost), `Across ${ALL_MONTHS.length} reported months`, { onClick: "navigate('monthly')", tooltip: 'Click to view the monthly analysis' })}
    ${kpiCard('purple', '⬆️', 'Highest Cost Month', MONTH_SHORT[highestMonth] + ' 2026', fmtM(hiVal), { onClick: `goToMonth('${highestMonth}')`, tooltip: `Click to view the ${highestMonth} breakdown` })}
    ${kpiCard('red', '⬇️', 'Lowest Cost Month', MONTH_SHORT[lowestMonth] + ' 2026', fmtM(loVal), { onClick: `goToMonth('${lowestMonth}')`, tooltip: `Click to view the ${lowestMonth} breakdown` })}
  </div>

  <div class="grid cols-2" style="margin-bottom:16px;">
    <div class="card">
      <div class="card-head"><h3>Combined Monthly Trend</h3><span class="tag msr">MSR + ZTM</span></div>
      <div class="chart-wrap lg"><canvas id="dashTrendChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>MSR vs ZTM Share (YTD)</h3></div>
      <div class="chart-wrap lg"><canvas id="dashDonutChart"></canvas></div>
    </div>
  </div>

  <div class="grid cols-3" style="margin-bottom:16px;">
    <div class="card">
      <div class="card-head"><h3>Category Distribution</h3></div>
      <div class="chart-wrap"><canvas id="dashCatChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Top 5 Vehicles (Total Cost)</h3></div>
      <div class="chart-wrap"><canvas id="dashVehChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Management Summary</h3></div>
      ${insightsList()}
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Monthly Summary Table</h3><span class="tag msr">Official values</span></div>
    ${monthlySummaryTable()}
  </div>
  `;
    }

    function kpiCard(color, icon, label, value, sub, opts) {
      opts = opts || {};
      const clickable = !!opts.onClick;
      let attrs = '';
      if (clickable) {
        const tip = (opts.tooltip || `Click to view ${label} details`).replace(/"/g, '&quot;');
        const aria = (opts.ariaLabel || `${label}: ${value}. ${opts.tooltip || 'Click for details'}`).replace(/"/g, '&quot;');
        attrs = ` tabindex="0" role="button" title="${tip}" aria-label="${aria}"` +
          ` onclick="${opts.onClick}"` +
          ` onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${opts.onClick}}"`;
      }
      const idAttr = opts.id ? ` id="${opts.id}"` : '';
      return `<div class="kpi-card${clickable ? ' kpi-clickable' : ''}"${idAttr}${attrs}>
    <div class="icon ${color}">${icon}</div>
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    <div class="delta flat">${sub}</div>
  </div>`;
    }

    // Sends the user to Monthly Analysis filtered down to a single month —
    // this both "selects" that month and shows its full detailed breakdown,
    // reusing the existing Monthly Analysis page rather than a new one.
    function goToMonth(month) {
      monthlyFilterState = { from: month, to: month };
      navigate('monthly');
      highlightTableRow(month);
    }

    // Scrolls to and visually highlights the row for `month` inside a table
    // already rendered on the current page (used by "Highest/Lowest Month"
    // KPI cards on program and category-detail pages, where the relevant
    // breakdown table is already on-screen — no navigation needed).
    function highlightTableRow(month, opts) {
      opts = opts || {};
      requestAnimationFrame(() => {
        const scope = opts.scopeId ? document.getElementById(opts.scopeId) : document;
        if (!scope) return;
        scope.querySelectorAll('tr[data-month].row-selected').forEach(r => r.classList.remove('row-selected'));
        const target = scope.querySelector(`tr[data-month="${month}"]`);
        if (target) {
          target.classList.add('row-selected');
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }

    function monthlySummaryTable() {
      let rows = ALL_MONTHS.map(m => {
        const c = combinedForMonth(m);
        return `<tr data-month="${m}">
      <td>${m} 2026</td>
      <td class="num">${c.msr !== null ? EGP(c.msr) : '<span class="na">N/A</span>'}</td>
      <td class="num">${c.ztm !== null ? EGP(c.ztm) : '<span class="na">N/A</span>'}</td>
      <td class="num"><b>${EGP(c.combined)}</b></td>
    </tr>`;
      }).join('');
      return `<div class="table-wrap"><table>
    <thead><tr><th>Month</th><th class="num">MSR</th><th class="num">ZTM</th><th class="num">Combined</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="font-weight:800; background:#f7f9fc;">
      <td>YTD Total</td><td class="num">${EGP(TOTAL_MSR)}</td><td class="num">${EGP(TOTAL_ZTM)}</td><td class="num">${EGP(TOTAL_COMBINED)}</td>
    </tr></tfoot>
  </table></div>`;
    }

    function insightsList() {
      // dynamic, data-driven insights
      const catTotalsMSR = CATS.map(c => ({ name: c.name, val: c.msr ? sumMonthly(MSR, MSR_MONTHS, c.msr) : 0 }));
      const catTotalsZTM = CATS.filter(c => c.ztm).map(c => ({ name: c.name, val: sumMonthly(ZTM, ZTM_MONTHS, c.ztm) }));
      const combinedCats = {};
      catTotalsMSR.forEach(c => combinedCats[c.name] = (combinedCats[c.name] || 0) + c.val);
      catTotalsZTM.forEach(c => combinedCats[c.name] = (combinedCats[c.name] || 0) + c.val);
      const topCat = Object.entries(combinedCats).sort((a, b) => b[1] - a[1])[0];
      const veh = vehicleAggregates();

      return `

    ${kpiCard('red', '⬇️', 'Lowest Month', MONTH_SHORT[months[loIdx]] + ' 2026', fmtM(monthlyTotals[loIdx]), { onClick: `highlightTableRow('${months[loIdx]}',{scopeId:'progBreakdownCard'})`, tooltip: `Click to highlight ${months[loIdx]} in the breakdown below` })}

      <tbody>${catRows.map((c, i) => `<tr><td><span class="rank">${i + 1}</span></td><td>${c.name}</td><td class="num">${EGP(c.val)}</td><td class="num">${(c.val / total * 100).toFixed(1)}%</td></tr>`).join('')}
      <tr><td></td><td><b>Vehicles (Fleet)</b></td><td class="num"><b>${EGP(vehTotal)}</b></td><td class="num"><b>${(vehTotal / total * 100).toFixed(1)}%</b></td></tr>

    function programMonthlyTable(dataObj, months, cats) {

        return `<tr data-month="${m}"><td>${m}</td>${cells}<td class="num">${EGP(vt)}</td><td class="num"><b>${EGP(dataObj === MSR ? monthMSRTotal(d) : monthZTMTotal(d))}</b></td></tr>`;
      }).join('');

    function activeMonthsInRange() {
      const fromIdx = ALL_MONTHS.indexOf(monthlyFilterState.from);
      const toIdx = ALL_MONTHS.indexOf(monthlyFilterState.to);

      return ALL_MONTHS.slice(lo, hi + 1);
    }
    function monthlySummaryTableFiltered() {
      const months = activeMonthsInRange();
      let msrSum = 0, ztmSum = 0, combSum = 0;
      let rows = months.map(m => {
        const c = combinedForMonth(m);
        if (c.msr !== null) msrSum += c.msr;
        if (c.ztm !== null) ztmSum += c.ztm;
        combSum += c.combined;
        return `<tr data-month="${m}"><td>${m} 2026</td><td class="num">${c.msr !== null ? EGP(c.msr) : '<span class="na">N/A</span>'}</td><td class="num">${c.ztm !== null ? EGP(c.ztm) : '<span class="na">N/A</span>'}</td><td class="num"><b>${EGP(c.combined)}</b></td></tr>`;
      }).join('');

      monthlyFilterState = { from: 'January', to: 'July' };

      mkChart('monthlyBarChart', {
        type: 'bar',

        data: { labels: ['MSR', 'ZTM'], datasets: [{ data: [TOTAL_MSR, TOTAL_ZTM], backgroundColor: ['#3b6fd6', '#0ea5a3'], borderWidth: 0 }] },

      });

        return { name: c.name, msr: m, ztm: z };
      });
      mkChart('cmpCatChart', {
        type: 'bar',
        data: {
          labels: catCompare.map(c => c.name), datasets: [
            { label: 'MSR', data: catCompare.map(c => c.msr), backgroundColor: '#3b6fd6', borderRadius: 5 },
            { label: 'ZTM', data: catCompare.map(c => c.ztm), backgroundColor: '#0ea5a3', borderRadius: 5 },
          ]
        }, options: { plugins: { legend: { position: 'bottom' } }, scales: { y: { grid: { color: '#f0f2f6' }, ticks: { callback: v => fmtM(v) } }, x: { grid: { display: false } } } }
      });

    /* ============================================================
       ALL CATEGORIES OVERVIEW
    ============================================================ */
    let catFilterState = { sort: 'total', program: 'all' };
    function categoryRowsData() {
      let rows = CATS.map(c => {
        const m = c.msr ? sumMonthly(MSR, MSR_MONTHS, c.msr) : 0;
        const z = c.ztm ? sumMonthly(ZTM, ZTM_MONTHS, c.ztm) : 0;
        return { ...c, msrVal: m, ztmVal: z, total: m + z };
      });
      if (catFilterState.program === 'msr') rows.sort((a, b) => b.msrVal - a.msrVal);
      else if (catFilterState.program === 'ztm') rows.sort((a, b) => b.ztmVal - a.ztmVal);
      else rows.sort((a, b) => b.total - a.total);
      return rows;
    }
    function pageCategories() {
      const rows = categoryRowsData();
      return `
  <div class="filter-bar">
    <label>Rank by</label>
    <div class="filter-chip-group" id="catSortChips">
      <span class="chip ${catFilterState.program === 'all' ? 'active' : ''}" data-p="all" onclick="setCatSort('all')">Combined</span>
      <span class="chip ${catFilterState.program === 'msr' ? 'active' : ''}" data-p="msr" onclick="setCatSort('msr')">MSR</span>
      <span class="chip ${catFilterState.program === 'ztm' ? 'active' : ''}" data-p="ztm" onclick="setCatSort('ztm')">ZTM</span>
    </div>
  </div>
  <div class="cat-tiles" id="catTiles">${categoryTilesHTML(rows)}</div>
  <div class="card" style="margin-bottom:16px;">
    <div class="card-head"><h3>Category Totals — MSR vs ZTM (YTD)</h3></div>
    <div class="chart-wrap lg"><canvas id="allCatChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Category Summary Table</h3></div>
    <div class="table-wrap" id="catTableWrap">${categoryTableHTML(rows)}</div>
  </div>
  `;
    }
    function categoryTilesHTML(rows) {
      return rows.map(c => `
    <div class="cat-tile" onclick="navigate('cat-${c.key}')">
      <div class="t-icon">${c.icon}</div>
      <div class="t-name">${c.name}</div>
      <div class="t-val" style="color:${c.color}">${fmtM(c.total)}</div>
    </div>`).join('');
    }
    function categoryTableHTML(rows) {
      return `<table><thead><tr><th>#</th><th>Category</th><th class="num">MSR</th><th class="num">ZTM</th><th class="num">Combined</th><th class="num">% of Total</th></tr></thead>
    <tbody>${rows.map((c, i) => `<tr><td><span class="rank">${i + 1}</span></td><td>${c.icon} ${c.name}</td><td class="num">${EGP(c.msrVal)}</td><td class="num">${c.ztm ? EGP(c.ztmVal) : '<span class="na">N/A</span>'}</td><td class="num"><b>${EGP(c.total)}</b></td><td class="num">${(c.total / TOTAL_COMBINED * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`;
    }
    function setCatSort(p) {
      catFilterState.program = p;
      document.querySelectorAll('#catSortChips .chip').forEach(c => c.classList.toggle('active', c.dataset.p === p));

      document.getElementById('catTiles').innerHTML = categoryTilesHTML(rows);
      document.getElementById('catTableWrap').innerHTML = categoryTableHTML(rows);
    }
    function mountCategoriesCharts() {
      const rows = categoryRowsData();
      mkChart('allCatChart', {
        type: 'bar',
        data: {
          labels: rows.map(c => c.name), datasets: [
            { label: 'MSR', data: rows.map(c => c.msrVal), backgroundColor: '#3b6fd6', borderRadius: 5 },
            { label: 'ZTM', data: rows.map(c => c.ztmVal), backgroundColor: '#0ea5a3', borderRadius: 5 },
          ]
        }, options: { plugins: { legend: { position: 'bottom' } }, scales: { y: { grid: { color: '#f0f2f6' }, ticks: { callback: v => fmtM(v) } }, x: { grid: { display: false } } } }
      });
    }

    /* ============================================================
       CATEGORY DETAIL PAGE
    ============================================================ */
    function pageCategoryDetail(key) {
      const c = catByKey(key);
      if (!c) return '<div class="card">Category not found.</div>';
      const msrVals = seriesByMonth(MSR, MSR_MONTHS, c.msr);
      const ztmVals = c.ztm ? seriesByMonth(ZTM, ZTM_MONTHS, c.ztm) : [];
      const msrTotal = msrVals.reduce((a, b) => a + b, 0);
      const ztmTotal = ztmVals.reduce((a, b) => a + b, 0);
      const combinedTotal = msrTotal + ztmTotal;
      const msrHiIdx = msrVals.indexOf(Math.max(...msrVals));
      const msrLoIdx = msrVals.indexOf(Math.min(...msrVals));

      let extra = '';
      // Buffet: item breakdown
      if (key === 'buffet') {
        extra = buffetItemsTable();
      }
      if (key === 'restaurant') {
        extra = restaurantDetailTable();
      }
      if (key === 'transportation') {
        extra = transportationDetailTable();
      }
      if (key === 'accommodation') {
        extra = accommodationDetailTable();
      }
      if (key === 'traveling') {
        extra = travelingDetailTable();
      }
      if (key === 'printing') {
        extra = printingDetailTable();
      }

      return `
  <div class="kpi-grid">
    ${kpiCard('teal', c.icon, 'Combined YTD', fmtM(combinedTotal), '', { onClick: "navigate('monthly')", tooltip: 'Click to view the combined monthly breakdown and YTD total' })}
    ${kpiCard('blue', '🅼', 'MSR Total', fmtM(msrTotal), `${(msrTotal / combinedTotal * 100 || 0).toFixed(1)}% of category`, { onClick: "navigate('msr')", tooltip: 'Click to view MSR monthly totals, categories and yearly total' })}
    ${c.ztm
      ? kpiCard('green', '🆉', 'ZTM Total', fmtM(ztmTotal), `${(ztmTotal / combinedTotal * 100 || 0).toFixed(1)}% of category`, { onClick: "navigate('ztm')", tooltip: 'Click to view ZTM monthly totals, categories and yearly total' })
      : kpiCard('green', '🆉', 'ZTM Total', 'N/A', 'Not tracked in ZTM sheets')}
    ${kpiCard('purple', '⬆️', 'Highest Month (MSR)', MONTH_SHORT[MSR_MONTHS[msrHiIdx]], EGP(msrVals[msrHiIdx]), { onClick: `highlightTableRow('${MSR_MONTHS[msrHiIdx]}',{scopeId:'catDetailTableCard'})`, tooltip: `Click to highlight ${MSR_MONTHS[msrHiIdx]} in the breakdown below` })}
    ${kpiCard('red', '⬇️', 'Lowest Month (MSR)', MONTH_SHORT[MSR_MONTHS[msrLoIdx]], EGP(msrVals[msrLoIdx]), { onClick: `highlightTableRow('${MSR_MONTHS[msrLoIdx]}',{scopeId:'catDetailTableCard'})`, tooltip: `Click to highlight ${MSR_MONTHS[msrLoIdx]} in the breakdown below` })}
    ${kpiCard('amber', '📊', '% of Grand Total', (combinedTotal / TOTAL_COMBINED * 100).toFixed(1) + '%', 'Share of all MSR+ZTM spend', { onClick: "navigate('compare')", tooltip: 'Click to view the combined MSR + ZTM comparison and how this % is calculated' })}
  </div>
  <div class="grid cols-2" style="margin-bottom:16px;">
    <div class="card">
      <div class="card-head"><h3>${c.name} — Monthly Trend</h3></div>
      <div class="chart-wrap lg"><canvas id="catTrendChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>${c.name} — MSR vs ZTM</h3></div>
      <div class="chart-wrap lg"><canvas id="catSplitChart"></canvas></div>
    </div>
  </div>
  <div class="card" id="catDetailTableCard" style="margin-bottom:16px;">
    <div class="card-head"><h3>${c.name} — Monthly Detail</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">MSR</th><th class="num">ZTM</th><th class="num">Combined</th></tr></thead>
    <tbody>${MSR_MONTHS.map((m, i) => `<tr data-month="${m}"><td>${m}</td><td class="num">${EGP(msrVals[i])}</td><td class="num">${c.ztm && i < ztmVals.length ? EGP(ztmVals[i]) : '<span class="na">N/A</span>'}</td><td class="num"><b>${EGP(msrVals[i] + (c.ztm && i < ztmVals.length ? ztmVals[i] : 0))}</b></td></tr>`).join('')}</tbody></table></div>
  </div>
  ${extra}
  `;
    }
    function mountCategoryDetailCharts(key) {
      const c = catByKey(key);
      if (!c) return;
      const msrVals = seriesByMonth(MSR, MSR_MONTHS, c.msr);
      const ztmVals = c.ztm ? seriesByMonth(ZTM, ZTM_MONTHS, c.ztm) : [];
      mkChart('catTrendChart', {
        type: 'line',
        data: {
          labels: MSR_MONTHS.map(m => MONTH_SHORT[m]), datasets: [
            { label: 'MSR', data: msrVals, borderColor: '#3b6fd6', backgroundColor: 'rgba(59,111,214,.08)', fill: true, tension: .35, borderWidth: 2.5, pointRadius: 4 },
            ...(c.ztm ? [{ label: 'ZTM', data: MSR_MONTHS.map((m, i) => i < ztmVals.length ? ztmVals[i] : null), borderColor: '#0ea5a3', backgroundColor: 'rgba(14,165,163,.08)', fill: true, tension: .35, borderWidth: 2.5, pointRadius: 4 }] : [])
          ]
        }, options: baseLineOpts()
      });
      mkChart('catSplitChart', {
        type: 'doughnut',
        data: { labels: ['MSR', 'ZTM'], datasets: [{ data: [msrVals.reduce((a, b) => a + b, 0), ztmVals.reduce((a, b) => a + b, 0)], backgroundColor: ['#3b6fd6', '#0ea5a3'], borderWidth: 0 }] },
        options: { plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16 } } }, cutout: '68%' }
      });
    }

    function buffetItemsTable() {
      const msrItems = ['Water', 'Tea', 'Sugar', 'Coffee'];
      const ztmItems = ['Tea', 'Coffee', 'Sugar', 'Juices', 'Pepsi', 'Nescafe', 'Milk', 'Herbs', 'Mineral Water'];
      const msrRows = msrItems.map(it => {
        const total = MSR_MONTHS.reduce((s, m) => s + (MSR[m].buffet[it] ? MSR[m].buffet[it].total : 0), 0);
        return `<tr><td>${it}</td><td class="num">${EGP(total)}</td></tr>`;
      }).join('');
      const ztmRows = ztmItems.map(it => {
        const total = ZTM_MONTHS.reduce((s, m) => s + (ZTM[m].buffet[it] ? ZTM[m].buffet[it].total : 0), 0);
        return `<tr><td>${it}</td><td class="num">${EGP(total)}</td></tr>`;
      }).join('');
      return `
  <div class="grid cols-2">
    <div class="card">
      <div class="card-head"><h3>MSR Buffet Items (YTD)</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">YTD Cost</th></tr></thead><tbody>${msrRows}</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>ZTM Buffet Items (YTD)</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">YTD Cost</th></tr></thead><tbody>${ztmRows}</tbody></table></div>
    </div>
  </div>`;
    }
    function restaurantDetailTable() {
      const rows = MSR_MONTHS.map(m => {
        const r = MSR[m].restaurant;
        return `<tr><td>${m}</td><td class="num">${EGP(r.day_cost)}</td><td class="num">${r.avg_meal_cost.toFixed(2)} EGP</td><td class="num">${fmt(r.avg_meals_per_day)}</td></tr>`;
      }).join('');
      return `<div class="card">
    <div class="card-head"><h3>Restaurant — Daily & Meal Metrics (MSR)</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">Avg Daily Cost</th><th class="num">Avg Meal Cost</th><th class="num">Avg Meals/Day</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
    }
    function transportationDetailTable() {
      const rows = MSR_MONTHS.map(m => {
        const t = MSR[m].transportation; const z = ZTM_MONTHS.includes(m) ? ZTM[m].transportation : null;
        return `<tr><td>${m}</td><td class="num">${fmt(t.trips)}</td><td class="num">${fmt(t.cars)}</td><td class="num">${z ? fmt(z.trips) : '<span class="na">N/A</span>'}</td><td class="num">${z ? fmt(z.cars) : '<span class="na">N/A</span>'}</td></tr>`;
      }).join('');
      return `<div class="card">
    <div class="card-head"><h3>Transportation — Trips & Cars</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">MSR Trips</th><th class="num">MSR Cars</th><th class="num">ZTM Trips</th><th class="num">ZTM Cars</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
    }
    function accommodationDetailTable() {
      const rows = MSR_MONTHS.map(m => {
        const a = MSR[m].accommodation; const z = ZTM_MONTHS.includes(m) ? ZTM[m].accommodation : null;
        return `<tr><td>${m}</td><td class="num">${fmt(a.rest_houses)}</td><td class="num">${z ? fmt(z.rest_houses) : '<span class="na">N/A</span>'}</td></tr>`;
      }).join('');
      return `<div class="card">
    <div class="card-head"><h3>Accommodation — Rest Houses Used</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">MSR Rest Houses</th><th class="num">ZTM Rest Houses</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
    }
    function travelingDetailTable() {
      const rows = MSR_MONTHS.map(m => {
        const t = MSR[m].traveling; const z = ZTM_MONTHS.includes(m) ? ZTM[m].traveling : null;
        return `<tr><td>${m}</td><td class="num">${fmt(t.users)}</td><td class="num">${z ? fmt(z.users) : '<span class="na">N/A</span>'}</td></tr>`;
      }).join('');
      return `<div class="card">
    <div class="card-head"><h3>Traveling — Users per Month</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">MSR Users</th><th class="num">ZTM Users</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
    }
    function printingDetailTable() {
      const rows = MSR_MONTHS.map(m => {
        const p = MSR[m].printing;
        return `<tr><td>${m}</td><td class="num">${p.qty ? fmt(p.qty) : '<span class="na">0</span>'}</td><td class="num">${p.price ? EGP(p.price) : '<span class="na">0</span>'}</td><td class="num">${EGP(p.total)}</td></tr>`;
      }).join('');
      return `<div class="card">
    <div class="card-head"><h3>Printing (A4) — MSR Only</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">Reams (Qty)</th><th class="num">Price/Ream</th><th class="num">Total Cost</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Printing costs were not found as a distinct section in the ZTM monthly sheets; shown as N/A rather than assumed zero cost.</p>
  </div>`;
    }

    /* ============================================================
       VEHICLES
    ============================================================ */
    let vehFilterState = { source: 'all', sort: 'total' };
    function pageVehicles() {
      const agg = vehicleAggregates();
      const top10 = agg.slice(0, 10);
      const totalFleet = agg.reduce((s, v) => s + v.total, 0);
      return `
  <div class="kpi-grid">
    ${kpiCard('teal', '🚗', 'Total Fleet Cost', fmtM(totalFleet), `${agg.length} vehicles tracked`)}
    ${kpiCard('blue', '⛽', 'Total Gasoline', fmtM(agg.reduce((s, v) => s + v.gasoline, 0)), 'MSR + ZTM combined')}
    ${kpiCard('amber', '🔧', 'Total Maintenance', fmtM(agg.reduce((s, v) => s + v.maintenance, 0)), 'MSR + ZTM combined')}
    ${kpiCard('purple', '🏆', 'Top Vehicle', top10[0].vehicle, EGP(top10[0].total))}
  </div>
  <div class="card" style="margin-bottom:16px;">
    <div class="card-head"><h3>Top 10 Most Expensive Vehicles</h3></div>
    <div class="chart-wrap lg"><canvas id="vehTop10Chart"></canvas></div>
  </div>
  <div class="filter-bar">
    <label>Program</label>
    <div class="filter-chip-group" id="vehSourceChips">
      <span class="chip ${vehFilterState.source === 'all' ? 'active' : ''}" data-src="all" onclick="setVehSource('all')">All</span>
      <span class="chip ${vehFilterState.source === 'MSR' ? 'active' : ''}" data-src="MSR" onclick="setVehSource('MSR')">MSR only</span>
      <span class="chip ${vehFilterState.source === 'ZTM' ? 'active' : ''}" data-src="ZTM" onclick="setVehSource('ZTM')">ZTM only</span>
    </div>
    <label style="margin-left:14px;">Sort by</label>
    <select id="vehSortSelect" onchange="setVehSort(this.value)">
      <option value="total" ${vehFilterState.sort === 'total' ? 'selected' : ''}>Total cost (high → low)</option>
      <option value="gasoline" ${vehFilterState.sort === 'gasoline' ? 'selected' : ''}>Gasoline (high → low)</option>
      <option value="maintenance" ${vehFilterState.sort === 'maintenance' ? 'selected' : ''}>Maintenance (high → low)</option>
      <option value="vehicle" ${vehFilterState.sort === 'vehicle' ? 'selected' : ''}>Vehicle No. (A → Z)</option>
    </select>
    <input id="vehicleSearchInput" placeholder="Filter by vehicle or driver…" style="border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:12.8px; width:220px; margin-left:auto;" oninput="filterVehicleTable(this.value)">
  </div>
  <div class="card">
    <div class="card-head"><h3>Vehicle Directory</h3><span id="vehCountTag" class="tag msr">${agg.length} vehicles</span></div>
    <div class="table-wrap"><table id="vehicleTable"><thead><tr><th>#</th><th>Vehicle No.</th><th>Driver</th><th>Program</th><th class="num">Gasoline</th><th class="num">Maintenance</th><th class="num">Total Cost</th><th class="num">Months Reported</th></tr></thead>
    <tbody id="vehicleTableBody">${vehicleRowsHTML(applyVehFilters(agg))}</tbody></table></div>
  </div>
  `;
    }
    function applyVehFilters(agg) {
      let rows = agg;
      if (vehFilterState.source !== 'all') {
        rows = rows.filter(v => v.sources.includes(vehFilterState.source));
      }
      const sort = vehFilterState.sort;
      rows = [...rows].sort((a, b) => {
        if (sort === 'vehicle') return a.vehicle.localeCompare(b.vehicle);
        return b[sort] - a[sort];
      });
      return rows;
    }
    function setVehSource(src) {
      vehFilterState.source = src;
      refreshVehicleTable();
    }
    function setVehSort(val) {
      vehFilterState.sort = val;
      refreshVehicleTable();
    }
    function refreshVehicleTable() {
      const agg = vehicleAggregates();
      document.querySelectorAll('#vehSourceChips .chip').forEach(c => c.classList.toggle('active', c.dataset.src === vehFilterState.source));
      const filtered = applyVehFilters(agg);
      document.getElementById('vehicleTableBody').innerHTML = vehicleRowsHTML(filtered);
      document.getElementById('vehCountTag').textContent = filtered.length + ' vehicles';
      const searchInput = document.getElementById('vehicleSearchInput');
      if (searchInput && searchInput.value) filterVehicleTable(searchInput.value);
    }
    function vehicleRowsHTML(agg) {
      return agg.map((v, i) => `<tr data-search="${(v.vehicle + ' ' + (v.driver || '')).toLowerCase()}">
    <td><span class="rank">${i + 1}</span></td><td>${v.vehicle}</td><td>${v.driver || '<span class="na">N/A</span>'}</td>
    <td>${v.sources.map(s => `<span class="tag ${s === 'MSR' ? 'msr' : 'ztm'}" style="margin-right:3px;">${s}</span>`).join('')}</td>
    <td class="num">${EGP(v.gasoline)}</td><td class="num">${EGP(v.maintenance)}</td><td class="num"><b>${EGP(v.total)}</b></td><td class="num">${v.months}</td>
  </tr>`).join('');
    }
    function filterVehicleTable(q) {
      q = q.trim().toLowerCase();
      document.querySelectorAll('#vehicleTable tbody tr').forEach(tr => {
        tr.style.display = tr.dataset.search.includes(q) ? '' : 'none';
      });
    }
    function mountVehiclesPage() {
      const agg = vehicleAggregates();
      const top10 = agg.slice(0, 10);
      mkChart('vehTop10Chart', {
        type: 'bar',
        data: { labels: top10.map(v => `${v.vehicle} (${v.driver || '—'})`), datasets: [{ data: top10.map(v => v.total), backgroundColor: '#3b6fd6', borderRadius: 6 }] },
        options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#f0f2f6' }, ticks: { callback: v => fmtM(v) } }, y: { grid: { display: false } } } }
      });
    }

    /* ============================================================
       GASOLINE
    ============================================================ */
    function pageGasoline() {
      const msrGas = seriesByMonth(MSR, MSR_MONTHS, d => d.vehicle_totals ? d.vehicle_totals.gasoline : 0);
      const ztmGas = seriesByMonth(ZTM, ZTM_MONTHS, d => d.vehicle_totals ? d.vehicle_totals.gasoline : 0);
      const totalMsrGas = msrGas.reduce((a, b) => a + b, 0);
      const totalZtmGas = ztmGas.reduce((a, b) => a + b, 0);
      const agg = vehicleAggregates().sort((a, b) => b.gasoline - a.gasoline).slice(0, 10);
      return `
  <div class="kpi-grid">
    ${kpiCard('blue', '⛽', 'MSR Gasoline (YTD)', fmtM(totalMsrGas), '')}
    ${kpiCard('teal', '⛽', 'ZTM Gasoline (YTD)', fmtM(totalZtmGas), '')}
    ${kpiCard('amber', '💰', 'Combined Gasoline', fmtM(totalMsrGas + totalZtmGas), '')}
  </div>
  <div class="grid cols-2" style="margin-bottom:16px;">
    <div class="card">
      <div class="card-head"><h3>Gasoline — Monthly Trend</h3></div>
      <div class="chart-wrap lg"><canvas id="gasTrendChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Top 10 Vehicles by Gasoline Cost</h3></div>
      <div class="chart-wrap lg"><canvas id="gasTopChart"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Gasoline — Monthly Detail</h3></div>

    /* ============================================================
       DATA QUALITY
    ============================================================ */
    function pageDataQuality() {
      const checks = [
        ['MSR months identified', '7 (January – July 2026)', 'ok'],
        ['ZTM months identified', '6 (January – June 2026)', 'ok'],
        ['MSR vehicle grand total cross-check', `Sum of monthly totals = ${EGP(sumMonthly(MSR, MSR_MONTHS, d => d.vehicle_totals ? d.vehicle_totals.grand_total : 0))} — matches the workbook's own "MSR 2026" annual summary sheet total of 986,531.56 EGP`, 'ok'],
        ['ZTM annual summary sheet ("ZTM 2026") completeness', 'The workbook\'s ZTM 2026 summary tab only has formulas populated for January–February; March–June are blank in that tab even though the individual monthly ZTM sheets (Mar–Jun Ztm) contain full data. This dashboard therefore computes ZTM YTD totals by summing the official monthly totals from each monthly sheet, not from the incomplete annual tab.', 'warn'],
        ['MSR restaurant YTD cross-check', `Sum of monthly official totals = ${EGP(sumMonthly(MSR, MSR_MONTHS, d => d.restaurant.month_cost))} — matches "MSR 2026" sheet cell (row 12) of 5,050,574.68 EGP`, 'ok'],
        ['Printing category', 'Present in MSR monthly sheets only ("printing cost" section). No equivalent section was found in the Jan–Jun ZTM monthly sheets, so ZTM printing is reported as N/A rather than 0.', 'warn'],
        ['ZTM vehicle detail columns', 'Column layout (fines/licenses/cards/subscriptions) differs slightly month to month in the ZTM sheets. Gasoline, maintenance and the row-level grand total were extracted per vehicle; other sub-categories (batteries, tires, filters, etc.) are not separately itemized for ZTM to avoid mis-mapping columns that shift position between months.', 'warn'],
        ['MSR vehicle detail columns', 'Consistent 15-column layout across all 7 monthly sheets (gasoline, maintenance, spare parts, batteries, oils, tires, filters, licenses, fines, wash, fees, garage, total) — fully itemized.', 'ok'],
        ['No recalculation from unit price × quantity', 'All category and monthly totals shown are the totals as written in the workbook. Buffet/item quantity × price detail is shown only as supplementary context alongside the official item total, never substituted for it.', 'ok'],
        ['No double counting', 'Category totals use the single official "month total" cell per category. Vehicle detail rows are not added on top of the vehicle grand-total row.', 'ok'],
      ];
      return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-head"><h3>Validation Checklist</h3></div>
    <div class="table-wrap"><table><thead><tr><th style="width:26%">Check</th><th>Result</th><th style="width:90px">Status</th></tr></thead>
    <tbody>${checks.map(c => `<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2] === 'ok' ? '<span class="badge lo">✅ OK</span>' : '<span class="badge mid">⚠ Note</span>'}</td></tr>`).join('')}</tbody></table></div>

    <tbody>
      <tr><td>Jan MSR</td><td>Restaurant</td><td>January</td><td>MSR</td><td class="num">${EGP(MSR.January.restaurant.month_cost)}</td><td>Row 11, "تكلفة الشهر" column</td></tr>

      <tr><td>Jan ZTM</td><td>Restaurant</td><td>January</td><td>ZTM</td><td class="num">${EGP(ZTM.January.restaurant.month_cost)}</td><td>Row 11, "تكلفة الشهر"</td></tr>

      <tr><td>MSR 2026</td><td>Restaurant — annual</td><td>YTD</td><td>MSR</td><td class="num">${EGP(MSR_YTD.restaurant)}</td><td>Row 12, last populated column (2026 total)</td></tr>
    </tbody></table></div>
    <p class="note">Every figure in this dashboard is traceable to a specific sheet, row and label exactly as it appears in the source workbook. No months, categories, or totals were invented; unavailable data is shown as N/A.</p>

    /* ============================================================
       PRINT REPORT
    ============================================================ */
    function pagePrintReport() {
      return `
  <div class="card" style="margin-bottom:16px; text-align:center; padding:40px 20px;">
    <div style="font-size:40px; margin-bottom:10px;">🖨️</div>
    <h3 style="margin:0 0 8px 0;">Generate the Full Management Report</h3>
    <p style="color:var(--text-soft); max-width:520px; margin:0 auto 20px auto;">
      This produces an A4-formatted, multi-page report covering the Executive Summary, MSR, ZTM, Monthly Analysis,
      Category Breakdown and Vehicle Analysis — with the sidebar, filters and buttons hidden automatically.
    </p>
    <button class="btn btn-primary" style="padding:12px 26px; font-size:14px;" onclick="preparePrintAndOpen()">🖨 Print Full Report Now</button>
  </div>
  <div class="card">
    <div class="card-head"><h3>Report Preview</h3></div>
    <div id="printPreviewArea"></div>
  </div>
  `;

    function mountPrintCharts() {
      const el = document.getElementById('printPreviewArea');
      if (!el) return;
      el.innerHTML = `
    <div class="grid cols-2">
      <div><h4>Executive Summary</h4>${monthlySummaryTable()}</div>
      <div><h4>Management Insights</h4>${insightsList()}</div>
    </div>`;
    }

    /* ---- Full multi-page printable report ---- */
    function buildFullReportHTML() {
      const catRows = CATS.map(c => {
        const m = c.msr ? sumMonthly(MSR, MSR_MONTHS, c.msr) : 0;
        const z = c.ztm ? sumMonthly(ZTM, ZTM_MONTHS, c.ztm) : 0;
        return { name: c.name, msr: m, ztm: z };
      }).sort((a, b) => (b.msr + b.ztm) - (a.msr + a.ztm));
      const topVeh = vehicleAggregates().slice(0, 10);
      const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

      const cover = `
  <div class="print-page" style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:240mm; text-align:center;">
    <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0ea5a3,#3b6fd6); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:24px; margin-bottom:18px;">MZ</div>
    <h1 style="font-size:28px; margin:0 0 6px 0;">MSR & ZTM Cost Management Report</h1>
    <div style="color:#5b6478; font-size:14px; margin-bottom:30px;">Fiscal Year 2026 · Consolidated Operations Report</div>
    <table style="width:60%; font-size:13px;">
      <tr><td style="padding:6px 0; color:#8993a8;">MSR period covered</td><td style="text-align:right;">January – July 2026</td></tr>
      <tr><td style="padding:6px 0; color:#8993a8;">ZTM period covered</td><td style="text-align:right;">January – June 2026</td></tr>
      <tr><td style="padding:6px 0; color:#8993a8;">Total combined cost</td><td style="text-align:right; font-weight:800;">${EGP(TOTAL_COMBINED)}</td></tr>
      <tr><td style="padding:6px 0; color:#8993a8;">Report generated</td><td style="text-align:right;">${today}</td></tr>
      <tr><td style="padding:6px 0; color:#8993a8;">Currency</td><td style="text-align:right;">EGP</td></tr>
    </table>
  </div>`;

      const execPage = `
  <div class="print-page">
    <h2>Executive Summary</h2>
    <div class="kpi-grid" style="margin-bottom:14px;">
      ${kpiCard('teal', '💰', 'Total Cost (YTD)', fmtM(TOTAL_COMBINED), '')}
      ${kpiCard('blue', '🅼', 'Total MSR', fmtM(TOTAL_MSR), '')}
      ${kpiCard('green', '🆉', 'Total ZTM', fmtM(TOTAL_ZTM), '')}
      ${kpiCard('amber', '📅', 'Avg Monthly Cost', fmtM(avgMonthlyCost), '')}
      ${kpiCard('purple', '⬆️', 'Highest Cost Month', MONTH_SHORT[highestMonth] + ' 2026', fmtM(hiVal))}
      ${kpiCard('red', '⬇️', 'Lowest Cost Month', MONTH_SHORT[lowestMonth] + ' 2026', fmtM(loVal))}
    </div>
    <div class="grid cols-2" style="margin-bottom:14px;">
      <div><h3>MSR vs ZTM Share</h3><div class="chart-wrap sm"><canvas id="printDonutChart"></canvas></div></div>
      <div><h3>Management Insights</h3>${insightsList()}</div>
    </div>
  </div>`;

      const monthlyPage = `
  <div class="print-page">
    <h2>Monthly Analysis</h2>
    <div class="chart-wrap sm" style="margin-bottom:16px;"><canvas id="printTrendChart"></canvas></div>
    ${monthlySummaryTable()}
    <h3 style="margin-top:20px;">Month-over-Month Change</h3>
    ${momTable()}
  </div>`;

      const msrPage = `
  <div class="print-page">
    <h2>MSR — 2026</h2>
    <p>Total MSR (YTD): <b>${EGP(TOTAL_MSR)}</b></p>
    ${programMonthlyTable(MSR, MSR_MONTHS, CATS.filter(c => c.msr))}
  </div>`;

      const ztmPage = `
  <div class="print-page">
    <h2>ZTM — 2026</h2>
    <p>Total ZTM (YTD): <b>${EGP(TOTAL_ZTM)}</b></p>
    ${programMonthlyTable(ZTM, ZTM_MONTHS, CATS.filter(c => c.ztm))}
  </div>`;

      const catPage = `
  <div class="print-page">
    <h2>Category Breakdown (YTD)</h2>
    <div class="chart-wrap sm" style="margin-bottom:16px;"><canvas id="printCatChart"></canvas></div>
    <table><thead><tr><th>Category</th><th class="num">MSR</th><th class="num">ZTM</th><th class="num">Combined</th></tr></thead>
    <tbody>${catRows.map(c => `<tr><td>${c.name}</td><td class="num">${EGP(c.msr)}</td><td class="num">${c.ztm ? EGP(c.ztm) : 'N/A'}</td><td class="num"><b>${EGP(c.msr + c.ztm)}</b></td></tr>`).join('')}</tbody></table>
  </div>`;

      const vehPage = `
  <div class="print-page">
    <h2>Vehicle Analysis — Top 10</h2>
    <div class="chart-wrap sm" style="margin-bottom:16px;"><canvas id="printVehChart"></canvas></div>
    <table><thead><tr><th>#</th><th>Vehicle</th><th>Driver</th><th class="num">Gasoline</th><th class="num">Maintenance</th><th class="num">Total</th></tr></thead>
    <tbody>${topVeh.map((v, i) => `<tr><td>${i + 1}</td><td>${v.vehicle}</td><td>${v.driver || 'N/A'}</td><td class="num">${EGP(v.gasoline)}</td><td class="num">${EGP(v.maintenance)}</td><td class="num"><b>${EGP(v.total)}</b></td></tr>`).join('')}</tbody></table>
    <p class="note" style="margin-top:16px;">All figures above are the official totals recorded in the source workbook (NEW__MSR-_ZTM_Months.xlsx) for each month and category. No values were recalculated or estimated; unavailable data is shown as N/A.</p>
  </div>`;

      return cover + execPage + monthlyPage + msrPage + ztmPage + catPage + vehPage;
    }

    function mountFullReportCharts() {
      const noAnim = { animation: false, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 12, font: { size: 10 } } } } };
      mkChart('printDonutChart', {
        type: 'doughnut',
        data: { labels: ['MSR', 'ZTM'], datasets: [{ data: [TOTAL_MSR, TOTAL_ZTM], backgroundColor: ['#3b6fd6', '#0ea5a3'], borderWidth: 0 }] },
        options: { ...noAnim, cutout: '65%' }
      });
      mkChart('printTrendChart', {
        type: 'line',
        data: {
          labels: ALL_MONTHS.map(m => MONTH_SHORT[m]), datasets: [
            { label: 'MSR', data: ALL_MONTHS.map(m => MSR[m] ? monthMSRTotal(MSR[m]) : null), borderColor: '#3b6fd6', backgroundColor: 'rgba(59,111,214,.08)', fill: true, tension: .3, borderWidth: 2, pointRadius: 3 },
            { label: 'ZTM', data: ALL_MONTHS.map(m => ZTM[m] ? monthZTMTotal(ZTM[m]) : null), borderColor: '#0ea5a3', backgroundColor: 'rgba(14,165,163,.08)', fill: true, tension: .3, borderWidth: 2, pointRadius: 3 },
          ]
        }, options: { ...noAnim, scales: { y: { grid: { color: '#f0f2f6' }, ticks: { callback: v => fmtM(v), font: { size: 9 } } }, x: { grid: { display: false }, ticks: { font: { size: 9 } } } } }
      });
      const catCombined = CATS.map(c => {
        const m = c.msr ? sumMonthly(MSR, MSR_MONTHS, c.msr) : 0;
        const z = c.ztm ? sumMonthly(ZTM, ZTM_MONTHS, c.ztm) : 0;
        return { name: c.name, val: m + z };
      }).sort((a, b) => b.val - a.val);
      mkChart('printCatChart', {
        type: 'bar',
        data: { labels: catCombined.map(c => c.name), datasets: [{ data: catCombined.map(c => c.val), backgroundColor: PALETTE, borderRadius: 4 }] },
        options: { ...noAnim, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#f0f2f6' }, ticks: { font: { size: 9 } } }, y: { grid: { display: false }, ticks: { font: { size: 9 } } } } }
      });
      const topVeh = vehicleAggregates().slice(0, 10);
      mkChart('printVehChart', {
        type: 'bar',
        data: { labels: topVeh.map(v => v.vehicle), datasets: [{ data: topVeh.map(v => v.total), backgroundColor: '#3b6fd6', borderRadius: 4 }] },
        options: { ...noAnim, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#f0f2f6' }, ticks: { font: { size: 9 } } }, y: { grid: { display: false }, ticks: { font: { size: 9 } } } } }
      });
    }

    function preparePrintAndOpen() {
      const contentEl = document.getElementById('content');
      const originalHTML = contentEl.innerHTML;
      destroyCharts();
      contentEl.innerHTML = buildFullReportHTML();
      document.body.classList.add('printing-full');
      const restore = () => {
        destroyCharts();
        contentEl.innerHTML = originalHTML;
        document.body.classList.remove('printing-full');
        requestAnimationFrame(() => mountCharts(currentPage));
        window.removeEventListener('afterprint', restore);
      };
      window.addEventListener('afterprint', restore);
      // Render the report's charts first (animation disabled so they paint immediately),
      // then wait two frames for the canvases to actually draw before opening the print dialog.
      requestAnimationFrame(() => {
        mountFullReportCharts();
        requestAnimationFrame(() => {
          setTimeout(() => {
            window.print();
            if (!window.matchMedia) { setTimeout(restore, 1200); }
          }, 120);
        });
      });
    }

  </script>
